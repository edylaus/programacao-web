<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Carrinho | NovaTech Store</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-nt py-3">
      <div class="container">
        <a class="navbar-brand logo-texto fs-4" href="../index.html">Nova<span>Tech</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="../index.html">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
            <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
            <li class="nav-item"><a class="nav-link" href="contato.html">Contato</a></li>
            <li class="nav-item">
              <a class="nav-link carrinho-icone active" href="carrinho.html">
                <i class="bi bi-cart3 fs-5"></i>
                <span class="carrinho-badge" id="carrinho-contador">0</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <section class="secao">
    <div class="container">
      <div class="secao-titulo">
        <h1 class="h2">Meu carrinho</h1>
        <p>Revise seus itens antes de finalizar a compra</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div id="lista-carrinho"><!-- itens inseridos via JavaScript --></div>
          <div id="carrinho-vazio" class="text-center py-5 d-none">
            <i class="bi bi-cart-x" style="font-size: 3.5rem; color: var(--cor-texto-suave);"></i>
            <p class="mt-3 text-muted">Seu carrinho está vazio.</p>
            <a href="produtos.html" class="btn btn-adicionar">Ver produtos</a>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="resumo-carrinho">
            <h5 class="mb-4">Resumo do pedido</h5>
            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal</span>
              <span id="carrinho-subtotal">R$ 0,00</span>
            </div>
            <div class="d-flex justify-content-between mb-3 text-muted small">
              <span>Frete</span>
              <span>Grátis</span>
            </div>
            <hr>
            <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
              <span>Total</span>
              <span id="carrinho-total">R$ 0,00</span>
            </div>
            <button class="btn btn-adicionar w-100 mb-2" id="btn-finalizar">Finalizar compra</button>
            <button class="btn btn-outline-secondary w-100" id="btn-limpar">Esvaziar carrinho</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="toast-carrinho" id="toast-carrinho"></div>

  <footer>
    <div class="container">
      <p class="text-center mb-0 small">&copy; 2026 NovaTech Store — Projeto acadêmico fictício, sem fins comerciais.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/carrinho.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
